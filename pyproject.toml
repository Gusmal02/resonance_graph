[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance-graph"
version = "0.1.0"
description = "Explora relaciones entre contenidos con grafos y navegación adaptativa trazable."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "networkx>=3,<4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Gusmal02/resonance_graph"
Documentation = "https://github.com/Gusmal02/resonance_graph/blob/main/technical.md"

[tool.setuptools.packages.find]
where = ["src"]
